<style>
/* VOICE: friendly, quick, pocket-proof. Few words, huge targets.
   IDEA: a scorecard pencil-ticked at the tee box.
   PICTURE: the big stroke counter is the picture; flag-in-cup mark on home.
   COLOUR and TYPE: warm orange field, white cards, blue + orange ink; Outfit.
   LAYOUT: one centred column, 460px max, controls in thumb reach. */
:root{color-scheme:light;--bg:#ff7a2e;--bg2:#ff9447;--card:#fff;--or:#f0590f;--orl:#fff1e8;--bl:#1a87cc;--bll:#e3f1fb;--ink:#1d2333;--mut:#7d8496;--line:#f2e8e1}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{margin:0;background:var(--bg) linear-gradient(170deg,var(--bg2),var(--bg) 55%) no-repeat;color:var(--ink);font:16px/1.5 Outfit,system-ui,sans-serif;position:fixed;inset:0;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
#app{max-width:460px;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom));height:100%;display:flex;flex-direction:column;overflow:hidden}
#app>*{flex:none}
#app>.mid{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:6vh}
#app .shrink{flex:0 1 auto;min-height:0;display:flex;flex-direction:column}
.fill{flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
button{font:inherit;cursor:pointer;border:0;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--bl);outline-offset:2px}
.brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:22px;margin:4px 4px 18px}
.brand svg{width:40px;height:40px}
.card{background:var(--card);border-radius:24px;padding:22px 20px;box-shadow:0 10px 30px rgba(140,50,0,.18)}
.card+.card{margin-top:14px}
h1{font-size:32px;line-height:1.05;margin:0 0 6px;color:var(--bl);font-weight:800}
h2{font-size:24px;line-height:1.1;margin:0 0 6px;color:var(--bl)}
h3{font-size:16px;margin:22px 0 8px;color:var(--ink)}
.muted{color:var(--mut);margin:0}
.center{text-align:center}
.kick{color:var(--or);font-weight:700;margin:0 0 4px;font-size:14px}
label{display:block;font-weight:600;font-size:14px;color:var(--mut);margin-top:16px}
input[type=text]{display:block;width:100%;margin-top:6px;font:500 18px Outfit,sans-serif;padding:14px 16px;border:2px solid var(--line);border-radius:14px;color:var(--ink);background:#fff}
input[type=text]:focus{border-color:var(--or);outline:0}
.primary{display:block;width:100%;margin-top:18px;background:var(--or);color:#fff;font-weight:700;font-size:18px;padding:16px;border-radius:16px;min-height:56px}
.primary:disabled{opacity:.4}
.ghost{background:var(--orl);color:var(--or);font-weight:700;padding:14px 18px;border-radius:14px;min-height:50px}
.blue{background:var(--bll);color:var(--bl)}
.link{background:none;color:var(--bl);font-weight:600;text-decoration:underline;padding:10px 0;min-height:44px}
.holes{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--orl);border-radius:18px;padding:8px}
.holes button{width:56px;height:56px;border-radius:14px;background:#fff;color:var(--or);font-size:28px;font-weight:700}
.holes output{font-size:44px;font-weight:800;color:var(--or)}
.chips{display:flex;gap:8px;margin-top:10px}
.chips button{flex:1;padding:10px;border-radius:12px;background:#fff;border:2px solid var(--line);font-weight:600;color:var(--mut);min-height:44px}
.chips button.on{border-color:var(--or);color:var(--or)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:16px}.opt span{font-weight:600;font-size:14px;color:var(--mut)}
.sw{flex:none;position:relative;width:56px;height:34px;border-radius:999px;background:var(--line);transition:background .2s}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.18);transition:transform .2s}
.sw.on{background:var(--or)}.sw.on::after{transform:translateX(22px)}
.maxs{display:flex;align-items:center;justify-content:space-between;margin-top:10px;background:var(--orl);border-radius:18px;padding:8px 8px 8px 20px}
.maxs .v{font-size:34px;font-weight:800;color:var(--or);font-variant-numeric:tabular-nums}.maxs .v small{font-size:16px;font-weight:600;color:var(--mut);margin-left:6px}
.maxs .ar{display:flex;gap:8px}.maxs .ar button{width:52px;height:52px;border-radius:14px;background:#fff;color:var(--or);display:grid;place-items:center}.maxs .ar svg{width:26px;height:26px}
.maxs .ar button:disabled,.arrows button:disabled{opacity:.35}
.prow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.modeb{flex:none;display:flex;gap:4px;padding:4px;border-radius:16px;background:var(--orl)}.modeb i{width:44px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--or);opacity:.55;transition:background .2s,color .2s,opacity .2s}.modeb i.on{background:var(--or);color:#fff;opacity:1}.modeb svg{width:22px;height:22px}
.pick{display:grid;gap:10px;margin-top:18px}
.pick button{min-height:72px;border-radius:18px;background:var(--bll);color:var(--bl);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;display:grid;place-items:center;border:3px solid transparent}
.pick button.on{background:var(--bl);color:#fff}
.pick button:active{transform:scale(.96)}.pick svg{width:28px;height:28px}
.check:disabled{opacity:.4}
.hero{align-items:stretch;text-align:center;gap:14px}.hero .primary{margin:0;font-size:20px;min-height:64px}.hero .hwhite{background:#fff;color:var(--or)}
.hlogo svg{width:120px;height:120px;filter:drop-shadow(0 8px 16px rgba(120,40,0,.25))}.htitle{color:#fff;font-size:40px;font-weight:800;line-height:1;margin:0}.hsub{color:#fff;opacity:.9;font-size:20px;font-weight:600;letter-spacing:.04em;margin:-6px 0 22px}
.plist{list-style:none;margin:0;padding:0}
.plist li{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-weight:600}
.plist li:first-child{border-top:0}
.av{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--bll);color:var(--bl);font-weight:800}
.tag{margin-left:auto;font-size:13px;color:var(--mut);font-weight:500}
.top{display:flex;align-items:center;justify-content:space-between;color:#fff;margin:0 4px 14px}
.top .h{font-size:20px;font-weight:500}.top .h b{font-size:34px;font-weight:800}
.xbtn{flex:none;width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;display:grid;place-items:center}.xbtn svg{width:20px;height:20px}
.brand .xbtn:last-child{margin-left:auto}.top .l{display:flex;align-items:center;gap:12px}
.danger{background:#d93a1a}
.bluebtn{background:var(--bl)}
.codebox{display:block;width:100%;flex:none;margin-top:12px;background:var(--orl);border-radius:16px;padding:10px 12px 12px;text-align:center}.codebox:active{transform:scale(.98)}.codebox span svg{width:14px;height:14px;margin-left:6px;vertical-align:-2px}.codebox span{display:block;font-size:13px;font-weight:600;color:var(--mut)}.codebox b{display:block;font-size:40px;line-height:1.1;font-weight:800;letter-spacing:.14em;color:var(--or);padding-left:.14em}
.codein{text-align:center;font-size:30px!important;font-weight:800!important;letter-spacing:.18em;text-transform:uppercase;color:var(--bl)!important}
.lbBtn{background:#fff;color:var(--bl);font-weight:700;padding:10px 16px;border-radius:999px;min-height:44px;display:flex;align-items:center;gap:6px}
.prog{display:flex;gap:4px;margin:0 4px 16px}
.prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.35)}
.prog i.d{background:#fff}.prog i.c{background:var(--bl)}
.pill{display:inline-block;background:var(--or);color:#fff;font-weight:700;border-radius:999px;padding:6px 14px;font-size:15px}
.turn{font-size:30px;font-weight:800;color:var(--bl);line-height:1.1;margin:10px 0 4px}
.step{display:flex;gap:12px;margin-top:18px;align-items:stretch}
.num{flex:1;display:grid;place-items:center;border:3px solid var(--bll);border-radius:22px;font-size:96px;font-weight:800;color:var(--bl);line-height:1;padding:12px 0;font-variant-numeric:tabular-nums}
.arrows{display:flex;flex-direction:column;gap:12px;width:92px}
.arrows button{flex:1;border-radius:18px;background:var(--bll);color:var(--bl);display:grid;place-items:center;min-height:64px}
.arrows button:active,.check:active{transform:scale(.96)}
.arrows svg{width:34px;height:34px}
.check{display:flex;align-items:center;justify-content:center;width:100%;margin-top:12px;background:var(--or);color:#fff;border-radius:20px;height:76px}
.check svg{width:40px;height:40px}
.wait{display:flex;align-items:center;gap:8px;color:var(--mut);margin-top:6px}
.dots i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--or);margin-right:4px;animation:bob 1.2s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{0%,80%,100%{opacity:.25;transform:none}40%{opacity:1;transform:translateY(-4px)}}
.sc{margin-left:auto;font-size:20px;font-weight:800;color:var(--bl);font-variant-numeric:tabular-nums}
.now .av{background:var(--or);color:#fff}
.sheetbg{position:fixed;inset:0;background:rgba(30,20,10,.45);z-index:20;animation:fade .2s}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:26px 26px 0 0;padding:22px 20px max(22px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;max-height:88vh;overflow:auto;animation:up .25s ease-out}
.sheet .row{display:flex;gap:10px;margin-top:20px}.sheet .row>*{flex:1;margin:0}
.bigq{font-size:30px;font-weight:800;color:var(--bl);margin:4px 0}
.sheet.ask{top:50%;bottom:auto;left:16px;right:16px;max-width:428px;border-radius:26px;padding:26px 20px 22px;text-align:center;transform:translateY(-50%);animation:popc .22s ease-out}
@keyframes popc{from{opacity:0;transform:translateY(-50%) scale(.92)}}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:10px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:13px;color:var(--mut);font-weight:500}
td.n,th.n{text-align:left;position:sticky;left:0;background:#fff;font-weight:700;max-width:120px;overflow:hidden;text-overflow:ellipsis}
td.t{font-weight:800;color:var(--bl);font-size:18px}
.rk{color:var(--or);font-weight:800;margin-right:6px}
.toast{position:fixed;left:16px;right:16px;bottom:max(20px,env(safe-area-inset-bottom));max-width:428px;margin:0 auto;background:var(--ink);color:#fff;padding:14px 16px;border-radius:14px;z-index:40;animation:up .2s}
/* hole transition overlay */
.ov{position:fixed;inset:0;z-index:30;background:linear-gradient(170deg,var(--bg2),var(--bg));display:grid;place-items:center;padding:20px;animation:fade .25s}
.ovc{width:100%;max-width:420px}
.ovc .card{padding:18px}
.lbr{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid var(--line);opacity:0;animation:rin .4s ease-out forwards}
.lbr:first-child{border-top:0}
.lbr .rk{width:22px}.lbr .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lbr .sc{font-size:22px}
@keyframes rin{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
.next{display:flex;align-items:center;justify-content:center;gap:12px;color:#fff;font-size:26px;font-weight:700;margin:28px 0 14px}
.flip{position:relative;display:inline-block;width:1.6em;height:1.3em;overflow:hidden;font-size:64px;line-height:1.3em;text-align:center}
.flip b{position:absolute;inset:0;font-weight:800}
.flip .o{animation:out .5s 1.5s ease-in forwards}.flip .n{transform:translateY(100%);animation:inn .5s 1.75s ease-out forwards}
@keyframes out{to{transform:translateY(-100%);opacity:0}}@keyframes inn{to{transform:none}}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.bar i{display:block;height:100%;background:#fff;width:var(--a);animation:grow .6s 1.8s ease-out forwards}
@keyframes grow{to{width:var(--b)}}
.ov.out{animation:fadeout .35s ease-in forwards}@keyframes fadeout{to{opacity:0}}
.endrow{display:flex;gap:10px}.endrow .primary{flex:1;background:#fff;color:var(--or)}.endrow .primary:first-child{color:var(--bl)}
.pic{-webkit-touch-callout:default;-webkit-user-select:auto;user-select:auto;display:block;width:100%;border-radius:16px;margin:12px 0;box-shadow:0 4px 14px rgba(0,0,0,.12)}
/* final */
.fr{display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:4px 12px;padding:12px 0;border-top:1px solid var(--line)}
.fr:first-child{border-top:0}
.fr .nm{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .cnt{font-size:26px;font-weight:800;color:var(--bl);font-variant-numeric:tabular-nums;text-align:right}
.fr .fb{grid-column:2/4;height:8px;border-radius:4px;background:var(--bll);overflow:hidden}
.fr .fb i{display:block;height:100%;width:0;background:var(--bl);border-radius:4px}
.fr.w .fb i{background:var(--or)}.fr.w .cnt{color:var(--or)}
.win{text-align:center;color:#fff;margin:6px 0 18px;opacity:0;transform:scale(.6)}
.win.go{animation:pop .7s cubic-bezier(.2,1.6,.4,1) forwards}
.win svg{width:120px;height:120px;filter:drop-shadow(0 8px 16px rgba(120,40,0,.3))}
.win .wn{font-size:40px;font-weight:800;line-height:1.05;text-wrap:balance}
.win .ws{font-size:18px;opacity:.9}
@keyframes pop{to{opacity:1;transform:none}}
.wpop{position:fixed;inset:0;z-index:32;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;background:rgba(255,122,46,.35);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);animation:fade .3s}
.wpop .win{margin:0}.wpop .win svg{width:150px;height:150px}.wpop .win .wn{font-size:46px}
.wpop .tap{color:#fff;font-weight:600;opacity:0;margin-top:28px;animation:pop .4s 1.2s forwards}
.wpop.out{animation:fadeout .25s ease-in forwards}
.conf{position:fixed;inset:0;pointer-events:none;z-index:35;overflow:hidden}
.conf i{position:absolute;top:-20px;left:50%;width:10px;height:14px;border-radius:2px;animation:fall var(--t) var(--d) cubic-bezier(.3,.6,.6,1) forwards}
@keyframes fall{to{transform:translate(var(--x),110vh) rotate(var(--r))}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.conf{display:none}}
</style>

<script>
{
const APP_URL = location.origin + location.pathname;
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = n => { const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; for (const x of crypto.getRandomValues(new Uint32Array(n))) s+=a[x%a.length]; return s; };
let store=null; try{ store=window.localStorage; }catch(e){}
const ls={get:k=>{try{return store?.getItem(k)||''}catch(e){return ''}},set:(k,v)=>{try{store?.setItem(k,v)}catch(e){}}};
const S={pid:ls.get('mg_pid'),gid:'',game:null,players:[],loaded:false,slow:false,draft:2,draftKey:'',holes:9,maxOn:false,maxS:7,mode:ls.get('mg_mode2')==='add'?'add':'pick',picked:false,
  hostName:ls.get('mg_name'),joinName:ls.get('mg_name'),joining:false,joined:false,sheet:null,sheetAt:0,proxy:false,
  pending:null,lastSeen:undefined,peers:[],err:'',dbState:'wait',finalKey:''};
if(!S.pid){ S.pid='p'+rid(10); ls.set('mg_pid',S.pid); }
let db=null, unsubG=null, timer=null, nameT=null, errT=null;
const ICON={
  back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  up:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15l7-7 7 7"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9l7 7 7-7"/></svg>',
  grid:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>',
  updown:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M7 9.5l5-5 5 5M7 14.5l5 5 5-5"/></svg>',
  pencil:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M5 15V6.5A2.5 2.5 0 0 1 7.5 4H15"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg>',
  board:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 20V11M12 20V4M18 20v-6"/></svg>',
  logo:'<svg viewBox="0 0 64 64"><ellipse cx="30" cy="53" rx="20" ry="6.5" fill="#fff" opacity=".3"/><ellipse cx="30" cy="53" rx="7.5" ry="2.8" fill="#b83d06"/><path d="M30 53V9" stroke="#fff" stroke-width="3.2" stroke-linecap="round"/><path d="M31.5 9.5l20 7.5-20 7.5z" fill="#1a87cc"/><circle cx="48" cy="50" r="5.5" fill="#fff"/></svg>',
  trophy:'<svg viewBox="0 0 120 120"><path d="M36 16h48v26a24 24 0 0 1-48 0z" fill="#fff"/><path d="M36 24H22a14 14 0 0 0 15 20M84 24h14a14 14 0 0 1-15 20" fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round"/><rect x="54" y="64" width="12" height="18" fill="#fff"/><rect x="38" y="82" width="44" height="12" rx="4" fill="#fff"/><circle cx="60" cy="38" r="9" fill="#1a87cc"/></svg>'
};

/* ---------- data helpers ---------- */
const holesPlayed=g=>(g.status==='done' && typeof g.played==='number')?g.played:g.holes;
function standings(g, upto){
  const last = upto ?? holesPlayed(g);
  const rows = (g.order||[]).map(pid=>{ const sc=(g.scores||{})[pid]||{}; let tot=0, played=0;
    for(let h=1;h<=last;h++){ const v=sc[h]; if(typeof v==='number'){ tot+=v; played++; } }
    return {pid, name:(g.names||{})[pid]||'Player', tot, played, sc}; });
  rows.sort((a,b)=>a.tot-b.tot || b.played-a.played);
  rows.forEach(r=>r.rank=1+rows.filter(x=>x.tot<r.tot).length);
  return rows;
}
const capOf=g=>(g&&g.maxStrokes)||20;
const toArr=o=>Array.isArray(o)?o:Object.values(o||{});
const nameOf=(g,pid)=>pid===S.pid?'You':((g.names||{})[pid]||'Player');
const initial=s=>esc((String(s||'?').trim()[0]||'?').toUpperCase());
function toast(m){ S.err=m; render(); clearTimeout(errT); errT=setTimeout(()=>{S.err='';render();},4000); }

/* ---------- connection (Firebase Realtime Database) ---------- */
function initDb(){
  const cfg=window.FIREBASE_CONFIG;
  if(!cfg || !cfg.databaseURL || !window.firebase) return null;
  try{ return (firebase.apps.length?firebase.app():firebase.initializeApp(cfg)).database(); }catch(e){ return null; }
}
db=initDb(); S.dbState=db?'ok':'none';
const gref=()=>db.ref('games/'+S.gid);
window.addEventListener('hashchange',route);
let offT=null;
if(db) db.ref('.info/connected').on('value',s=>{ const was=S.online; S.online=!!s.val(); clearTimeout(offT); if(was===true && !S.online) offT=setTimeout(()=>{ if(!S.online && S.game && S.game.status==='playing') toast('Offline. Scores will send when signal returns.'); },4000); });

function route(){
  const h=(location.hash||'').slice(1), gid=/^g[a-z0-9]{4,12}$/.test(h)?h:'';
  if(gid===S.gid && (gid==='' || unsubG)) return render();
  unsubG&&unsubG(); unsubG=null;
  Object.assign(S,{gid,game:null,players:[],loaded:false,slow:false,joined:false,lastSeen:undefined,sheet:null,proxy:false,finalKey:'',png:null});
  $('#ovl').innerHTML=''; document.querySelectorAll('.conf').forEach(c=>c.remove());
  if(gid){ ls.set('mg_gid',gid); if(db) subscribe(); }
  render();
}
function subscribe(){
  clearTimeout(timer); timer=setTimeout(()=>{ if(!S.loaded){ S.slow=true; render(); } },10000);
  const ref=gref();
  const cb=sn=>{
    clearTimeout(timer); S.slow=false; S.loaded=true;
    const v=sn.val();
    if(v && typeof v==='object'){
      S.game={...v, order:toArr(v.order), names:v.names||{}, scores:v.scores||{}};
      S.players=Object.entries(v.players||{}).map(([id,p])=>({id,name:String((p&&p.name)||'Player'),at:Number(p&&p.at)||0})).sort((a,b)=>a.at-b.at);
    } else { S.game=null; S.players=[]; }
    if(S.players.some(p=>p.id===S.pid)) S.joined=true;
    onGame(); render();
  };
  ref.on('value',cb,()=>{ clearTimeout(timer); S.loaded=true; toast("Can't reach the game. Reopen the link."); });
  unsubG=()=>ref.off('value',cb);
}
function onGame(){
  const g=S.game; if(!g) return;
  const L=(g.last&&g.last.at)||0;
  if(S.lastSeen===undefined) S.lastSeen=L;
  else if(L!==S.lastSeen){ S.lastSeen=L; if(g.status==='playing') showTransition(g); }
  if(g.status==='playing'){
    const k=g.hole+'-'+g.turn; if(S.draftKey!==k){ S.draftKey=k; const d=ls.get('mg_draft').split('|'); const cap=capOf(g); const had=d[0]===S.gid&&d[1]===k; S.draft=had?Math.max(1,Math.min(cap,Number(d[2])||2)):Math.min(2,cap); S.picked=had; S.proxy=false; if(S.sheet==='confirm') S.sheet=null; }
  }
}

/* ---------- actions ---------- */
async function create(){
  if(!db) return toast('This site still needs its database set up.');
  const gid='g'+rid(6); S.creating=true; render();
  try{
    await db.ref('games/'+gid).set({holes:S.holes,maxStrokes:S.maxOn?S.maxS:null,hostId:S.pid,status:'lobby',hole:1,turn:0,created:Date.now()});
    S.page=''; location.hash=gid;
  }catch(e){ toast("Couldn't create the game. Check your connection."); }
  S.creating=false; render();
}
function saveHostName(){
  clearTimeout(nameT);
  nameT=setTimeout(async()=>{ const n=S.hostName.trim().slice(0,24); if(!n||!S.gid) return; ls.set('mg_name',n);
    try{ await gref().child('players/'+S.pid).set({name:n,at:(S.players.find(p=>p.id===S.pid)||{}).at||0}); }catch(e){} },500);
}
async function start(){
  const name=S.hostName.trim().slice(0,24);
  if(!name) return toast('Enter your name first.');
  ls.set('mg_name',name);
  const others=S.players.filter(p=>p.id!==S.pid), order=[S.pid,...others.map(p=>p.id)], names={[S.pid]:name};
  others.forEach(p=>names[p.id]=String(p.name||'Player').slice(0,24));
  try{ await gref().update({status:'playing',order,names,hole:1,turn:0,scores:null,started:Date.now(),['players/'+S.pid]:{name,at:0}}); }
  catch(e){ toast("Couldn't start the game. Try again."); }
}
async function join(){
  const name=S.joinName.trim().slice(0,24); if(!name) return;
  ls.set('mg_name',name); S.joining=true; render();
  try{ await gref().child('players/'+S.pid).set({name,at:Date.now()}); S.joined=true; }
  catch(e){ toast("Couldn't join. Check your connection and try again."); }
  S.joining=false; render();
}
async function submit(){
  const g=S.game; if(!g || g.status!=='playing') return;
  const forPid=g.order[g.turn]; if(forPid!==S.pid && !(S.proxy && g.hostId===S.pid)) return;
  const score=S.draft, h=g.hole, t=g.turn; S.sheet=null; render();
  try{
    const res=await gref().transaction(cur=>{
      if(!cur) return cur;
      const o=toArr(cur.order);
      if(cur.status!=='playing' || cur.hole!==h || cur.turn!==t || o[t]!==forPid) return;
      cur.scores=cur.scores||{};
      const mine={}; for(const [k,v] of Object.entries(cur.scores[forPid]||{})) if(v!=null) mine[k]=v;
      mine[h]=Math.min(score,capOf(cur)); cur.scores[forPid]=mine;
      if(t+1<o.length) cur.turn=t+1;
      else if(h>=cur.holes){ cur.status='done'; cur.last={hole:h,at:Date.now()}; }
      else { cur.hole=h+1; cur.turn=0; cur.last={hole:h,at:Date.now()}; }
      return cur;
    });
    if(!res.committed) toast('That score was already entered.');
  }catch(e){ toast("Couldn't save. Check your signal and try again."); }
}

async function endOrLeave(){
  const g=S.game; S.sheet=null;
  if(!g){ render(); return; }
  if(g.hostId!==S.pid){ ls.set('mg_gid',''); location.hash=''; return; }
  const patch=g.status==='lobby'?{status:'done',played:0}:{status:'done',played:Math.max(0,g.hole-1),last:{hole:g.hole,at:Date.now()}};
  try{ await gref().update(patch); }catch(e){ toast("Couldn't end the game. Try again."); }
  render();
}
async function joinByCode(){
  const code=(S.code||'').toLowerCase(); if(code.length!==6 || !db || S.checking) return;
  S.checking=true; render();
  let found=false;
  try{ const sn=await db.ref('games/g'+code+'/status').once('value'); found=sn.val()!=null; }catch(e){}
  S.checking=false;
  if(!found){ S.codeErr=true; render(); return; }
  S.sheet=null; S.page=''; S.code=''; location.hash='g'+code;
}
/* ---------- views ---------- */
const shell=(inner,x,back)=>`<div class="brand">${back?`<button class="xbtn" data-a="goback" aria-label="Back">${ICON.back}</button>`:ICON.logo}<span>Mini Golf</span>${x?`<button class="xbtn" data-a="endask" aria-label="${x}">${ICON.x}</button>`:''}</div><div class="mid">${inner}</div>`;
function home(){

    <button class="primary hwhite" data-a="createask" ${!db?'disabled':''}>Create game</button>
    <button class="primary bluebtn" data-a="joinask" ${!db?'disabled':''}>Join game</button>
    ${!db?'<p class="center" style="color:#fff;margin-top:14px">This site needs its database connected before games can start.</p>':''}</div>`;
}
function createPage(){

    <div class="opt"><span id="maxLbl">Max strokes per hole</span><button class="sw ${S.maxOn?'on':''}" data-a="maxt" role="switch" aria-checked="${S.maxOn}" aria-labelledby="maxLbl"></button></div>
    ${S.maxOn?`<div class="maxs"><div class="v">${S.maxS}<small>stroke${S.maxS===1?'':'s'}</small></div><div class="ar"><button data-a="maxd" aria-label="Lower max strokes" ${S.maxS<=1?'disabled':''}>${ICON.down}</button><button data-a="maxu" aria-label="Raise max strokes" ${S.maxS>=20?'disabled':''}>${ICON.up}</button></div></div>`:''}
    <button class="primary" data-a="create" ${S.creating||!db?'disabled':''}>${S.creating?'Creating…':'Create'}</button></div></div>`;
}
function joinPage(){
  return `<div class="brand"><button class="xbtn" data-a="back" aria-label="Back">${ICON.back}</button><span>Join a game</span></div>
    <div class="mid"><div class="card"><h1>Enter code</h1><p class="muted">Type the 6-letter code from the host's lobby.</p>
      <input type="text" id="joinCode" class="codein" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="characters" spellcheck="false" value="${esc((S.code||'').toUpperCase())}" placeholder="CODE" style="margin-top:16px">${S.codeErr?'<p class="center" style="color:#d93a1a;font-weight:600;margin:10px 0 0">No game found with that code.</p>':''}
      <button class="primary bluebtn" id="codeBtn" data-a="joincode" ${(S.code||'').length===6&&!S.checking?'':'disabled'}>${S.checking?'Finding…':'Join'}</button></div></div>`;
}
function plist(g){
  if(!S.players.length) return '<p class="muted">No one yet. Share the invite.</p>';
  return `<ul class="plist">${S.players.map(p=>`<li><span class="av">${initial(p.name)}</span><span>${esc(p.name)}</span><span class="tag">${p.id===g.hostId?'Host':''}${p.id===S.pid?(p.id===g.hostId?' · you':'You'):''}</span></li>`).join('')}</ul>`;
}
function hostLobby(g){
  const others=S.players.filter(p=>p.id!==S.pid);
  return shell(`<div class="card shrink"><p class="kick">${g.holes} holes${g.maxStrokes?` · max ${g.maxStrokes} strokes`:''}</p><h1>Lobby</h1>
    <button class="codebox" data-a="copycode" aria-label="Copy game code"><span>${S.copied?'Copied!':'Game code'}${S.copied?'':ICON.copy}</span><b>${esc(S.gid.slice(1).toUpperCase())}</b></button>
    <button class="ghost blue" data-a="share" style="width:100%;margin-top:10px">Share</button>
    <label for="hostName">Your name</label><input type="text" id="hostName" maxlength="24" autocomplete="off" value="${esc(S.hostName)}" placeholder="Enter your name">
    <h3>Players joined</h3>
    <div class="fill">${others.length?`<ul class="plist">${others.map(p=>`<li><span class="av">${initial(p.name)}</span><span>${esc(p.name)}</span></li>`).join('')}</ul>`:'<p class="muted">No one yet. Share the invite so friends can join.</p>'}</div>
    <button class="primary" id="startBtn" data-a="start" ${S.hostName.trim()?'':'disabled'}>Start</button></div>`,'Cancel game');
}
function joinForm(g){
  return shell(`<div class="card"><p class="kick">${g.holes} holes${g.maxStrokes?` · max ${g.maxStrokes} strokes`:''}</p><h1>Join the game</h1>
    <label for="joinName">Your name</label><input type="text" id="joinName" maxlength="24" autocomplete="off" value="${esc(S.joinName)}" placeholder="Enter your name">
    <button class="primary" id="joinBtn" data-a="join" ${S.joinName.trim()&&!S.joining?'':'disabled'}>${S.joining?'Joining…':'Join'}</button></div>`,'Leave');
}
function waiting(g){
  const ok=S.joined;
  return shell(`<div class="card center"><p class="kick">${ok?"You're in":'Connecting to host'}</p><h2>Waiting for host to start</h2>
    <div class="dots" style="margin:12px 0 4px"><i></i><i></i><i></i></div></div>
    <div class="card shrink"><h3 style="margin-top:0">Players</h3><div class="fill">${plist(g)}</div></div>`,'Leave game');
}
function holeList(g){
  return `<ul class="plist">${g.order.map((pid,i)=>{ const v=((g.scores||{})[pid]||{})[g.hole];
    return `<li class="${i===g.turn?'now':''}"><span class="av">${initial((g.names||{})[pid])}</span><span>${esc(nameOf(g,pid))}</span>${typeof v==='number'?`<span class="sc">${v}</span>`:`<span class="tag">${i===g.turn?'Putting now':'Up next'}</span>`}</li>`; }).join('')}</ul>`;
}
function topbar(g){
  return `<div class="top"><div class="l"><button class="xbtn" data-a="endask" aria-label="${g.hostId===S.pid?'End game':'Leave game'}">${ICON.x}</button><div class="h">Hole <b>${g.hole}</b> of ${g.holes}</div></div><button class="lbBtn" data-a="board">${ICON.board}Leaderboard</button></div>
    <div class="prog">${Array.from({length:g.holes},(_,i)=>`<i class="${i+1<g.hole?'d':i+1===g.hole?'c':''}"></i>`).join('')}</div>`;
}
function pickGrid(g){
  const m=g.maxStrokes, capped=m&&m<=10, n=capped?m:10, cols=n<=5?n:Math.ceil(n/2), sel=h=>S.picked&&S.draft===h?'on':'';
  let b='';
  for(let i=1;i<n;i++) b+=`<button data-a="pk" data-n="${i}" class="${sel(i)}">${i}</button>`;
  b+=capped?`<button data-a="pk" data-n="${m}" class="${sel(m)}">${m}+</button>`:`<button data-a="pkmore" aria-label="Enter score">${ICON.pencil}</button>`;
  return `<div class="pick" style="grid-template-columns:repeat(${cols},1fr)">${b}</div>`;
}
function play(g){
  const cur=g.order[g.turn], mine=cur===S.pid, host=g.hostId===S.pid, entering=mine||(S.proxy&&host);
  let main;
  if(entering){
    const pick=S.mode==='pick';
    main=`<div class="card"><div class="prow"><span class="pill">${mine?'Your turn':'Entering for '+esc(nameOf(g,cur))}</span><button class="modeb" data-a="mode" role="switch" aria-checked="${pick}" aria-label="Number boxes"><i class="${pick?'on':''}">${ICON.grid}</i><i class="${pick?'':'on'}">${ICON.updown}</i></button></div>
      ${pick?pickGrid(g):`<div class="step"><div class="num" aria-live="polite">${S.draft}${g.maxStrokes&&S.draft>=g.maxStrokes?'+':''}</div>
      <div class="arrows"><button data-a="up" aria-label="Add a stroke" ${S.draft>=capOf(g)?'disabled':''}>${ICON.up}</button><button data-a="down" aria-label="Remove a stroke" ${S.draft<=1?'disabled':''}>${ICON.down}</button></div></div>`}
      <button class="check" data-a="check" aria-label="Submit score" ${pick&&!S.picked?'disabled':''}>${ICON.check}</button>
      ${!mine?'<button class="link" data-a="unproxy">Cancel</button>':''}</div>`;
  } else {
    main=`<div class="card"><p class="kick">Now putting</p><div class="turn">${esc(nameOf(g,cur))}'s turn</div>
      <div class="wait"><span class="dots"><i></i><i></i><i></i></span>You'll be up ${g.order.indexOf(S.pid)>g.turn?'soon':'next hole'}</div>
      ${host?`<button class="link" data-a="proxy">Enter score for ${esc(nameOf(g,cur))}</button>`:''}</div>`;
  }
  return topbar(g)+`<div class="mid">`+main+(g.order.length>1?`<div class="card shrink" style="padding-block:10px"><div class="fill">${holeList(g)}</div></div>`:'')+`</div>`;
}
function spectator(g){
  return topbar(g)+`<div class="mid"><div class="card"><h2>Game in progress</h2><p class="muted">This game started before you joined. You can follow the leaderboard.</p></div></div>`;
}
function finalView(g){
  const hp=holesPlayed(g);
  if(hp<1) return shell(`<div class="card"><p class="kick">Game ended</p><h2>No holes were finished</h2><p class="muted">The game ended before anyone finished a hole.</p><button class="primary" data-a="home">Play again</button></div>`);
  const rows=standings(g), max=Math.max(1,...rows.map(r=>r.tot)), best=rows[0]?rows[0].tot:0, wins=rows.filter(r=>r.tot===best);
  const wn=wins.length>1?wins.map(w=>esc(nameOf(g,w.pid))).join(' & ')+' tie!':(wins[0]?(wins[0].pid===S.pid?'You win!':esc(wins[0].name)+' wins!'):'');
  S.winHtml=`${ICON.trophy}<div class="wn">${wn}</div><div class="ws">${best} strokes · ${hp} hole${hp===1?'':'s'}${hp<g.holes?' (ended early)':''}</div>`;
  return `<div class="win" id="win">${ICON.trophy}<div class="wn">${wn}</div><div class="ws">${best} strokes · ${hp} hole${hp===1?'':'s'}${hp<g.holes?' (ended early)':''}</div></div>
    <div class="card shrink"><p class="kick">Final scores</p><div id="fin" class="fill">${rows.map(r=>`<div class="fr ${r.tot===best?'w':''}"><span class="rk">${r.rank}</span><span class="nm">${esc(nameOf(g,r.pid))}</span><span class="cnt" data-to="${r.tot}">0</span><div class="fb"><i data-w="${(r.tot/max*100).toFixed(1)}"></i></div></div>`).join('')}</div></div>
    <button class="link" data-a="board" style="color:#fff;align-self:center">View full scorecard</button>
    <div class="endrow"><button class="primary" data-a="pic">Save picture</button><button class="primary" data-a="home">Play again</button></div>`;
}
function scoreTable(g){
  const rows=standings(g), hs=Array.from({length:holesPlayed(g)},(_,i)=>i+1);
  return `<table><thead><tr><th class="n">Player</th>${hs.map(h=>`<th>${h}</th>`).join('')}<th>Total</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td class="n"><span class="rk">${r.rank}</span>${esc(nameOf(g,r.pid))}</td>${hs.map(h=>`<td>${typeof r.sc[h]==='number'?r.sc[h]:'·'}</td>`).join('')}<td class="t">${r.tot}</td></tr>`).join('')}</tbody></table>`;
}
function sheet(){
  const g=S.game; if(!S.sheet) return '';
  let body='';
  if(S.sheet==='confirm' && g){
    const cur=g.order[g.turn];
    body=`${cur!==S.pid?`<p class="kick">For ${esc(nameOf(g,cur))}</p>`:''}<div class="bigq">Submit ${S.draft}${g.maxStrokes&&S.draft>=g.maxStrokes?'+':''} stroke${S.draft===1?'':'s'}?</div><p class="muted">This can't be changed after it's in.</p>
      <div class="row"><button class="ghost" data-a="close">Cancel</button><button class="primary" data-a="yes" style="margin:0">Submit</button></div>`;
  } else if(S.sheet==='board' && g){
    const rows=standings(g);
    body=`<h2>Leaderboard</h2><p class="muted">Lowest score wins.</p>
      <ul class="plist" style="margin-top:8px">${rows.map(r=>`<li><span class="rk">${r.rank}</span><span>${esc(nameOf(g,r.pid))}</span><span class="tag">thru ${r.played}</span><span class="sc" style="margin-left:12px">${r.tot}</span></li>`).join('')}</ul>
      <h3>Scorecard</h3><div class="scroll">${scoreTable(g)}</div><div class="row"><button class="ghost" data-a="close">Close</button></div>`;
  } else if(S.sheet==='end' && g){
    const host=g.hostId===S.pid, lobby=g.status==='lobby', done=Math.max(0,g.hole-1);
    body=host
      ? `<div class="bigq">${lobby?'Cancel this game?':'End game for everyone?'}</div><p class="muted">${lobby?'Everyone in the lobby will be sent out.':(done?`Final scores use the ${done} finished hole${done===1?'':'s'}. Hole ${g.hole} won't count.`:'No holes are finished yet, so there will be no scores.')}</p>
        <div class="row"><button class="ghost" data-a="close">Keep playing</button><button class="primary danger" data-a="endyes" style="margin:0">${lobby?'Cancel game':'End game'}</button></div>`
      : `<div class="bigq">Leave this game?</div><p class="muted">The game keeps going for everyone else. You can rejoin from the invite link.</p>
        <div class="row"><button class="ghost" data-a="close">Stay</button><button class="primary danger" data-a="endyes" style="margin:0">Leave</button></div>`;
  } else if(S.sheet==='pic' && S.png){
    body=`<h2>Save picture</h2><img class="pic" src="${esc(S.png.url)}" alt="Final scorecard"><p class="muted">Press and hold the picture to save it to your photos.</p><a class="ghost blue" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="${esc(S.png.url)}" download="mini-golf-scores.png">Download</a>
      <div class="row"><button class="ghost" data-a="close">Done</button></div>`;
  } else return '';
  return `<div class="sheetbg" data-a="close"></div><div class="sheet${S.sheet==='confirm'?' ask':''}" role="dialog" aria-modal="true">${body}</div>`;
}
function view(){
  if(S.dbState==='wait') return shell('<p class="center" style="color:#fff">Loading…</p>');
  if(!S.gid) return S.page==='join'?joinPage():S.page==='create'?createPage():home();
  if(!db) return shell('<div class="card"><h2>Almost ready</h2><p class="muted">This site needs its database connected before games can start.</p></div>');
  if(!S.loaded) return shell(`<div class="card"><p class="muted center">${S.slow?"Can't reach the game yet. Check your connection.":'Opening game…'}</p></div>`);
  const g=S.game;
  if(!g){ ls.set('mg_gid',''); return shell('<div class="card"><h2>Game not found</h2><p class="muted">This invite may be old.</p><button class="primary" data-a="home">Start a new game</button></div>'); }
  if(g.status==='lobby') return g.hostId===S.pid?hostLobby(g):S.joined?waiting(g):joinForm(g);
  if(g.status==='done') return finalView(g);
  if(!g.order.includes(S.pid)) return spectator(g);
  return play(g);
}
let lastHtml='';
function render(){
  const html=view()+sheet()+(S.err?`<div class="toast" role="status">${esc(S.err)}</div>`:'');
  if(html===lastHtml) return;
  const a=document.activeElement, id=a&&a.id, ss=a&&a.selectionStart;
  $('#app').innerHTML=html; lastHtml=html;
  if(id){ const n=document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(ss,ss); }catch(e){} } }
  if(S.game && S.game.status==='done' && S.finalKey!==S.gid){ S.finalKey=S.gid; if($('#fin')) animateFinal(); }
  else if(S.game && S.game.status==='done') finishFinal();
}

/* ---------- animations ---------- */
function showTransition(g){
  const h=g.last.hole, rows=standings(g,h), o=$('#ovl');
  o.innerHTML=`<div class="ov" data-a="ovclose"><div class="ovc">
    <p class="center" style="color:#fff;font-weight:700;margin:0 0 10px">Hole ${h} complete</p>
    <div class="card">${rows.map((r,i)=>`<div class="lbr" style="animation-delay:${.1+i*.09}s"><span class="rk">${r.rank}</span><span class="nm">${esc(nameOf(g,r.pid))}</span><span class="sc">${r.tot}</span></div>`).join('')}</div>
    <div class="next"><span>Hole</span><span class="flip"><b class="o">${h}</b><b class="n">${h+1}</b></span><span>of ${g.holes}</span></div>
    <div class="bar"><i style="--a:${(h/g.holes*100).toFixed(1)}%;--b:${((h+1)/g.holes*100).toFixed(1)}%"></i></div>
    </div></div>`;
  clearTimeout(showTransition.t); clearTimeout(showTransition.u);
  showTransition.t=setTimeout(()=>{ const ov=o.querySelector('.ov'); if(ov) ov.classList.add('out'); },3300);
  showTransition.u=setTimeout(()=>{ o.innerHTML=''; },3650);
}
function finishFinal(){
  document.querySelectorAll('#fin .cnt').forEach(c=>c.textContent=c.dataset.to);
  document.querySelectorAll('#fin .fb i').forEach(b=>b.style.width=b.dataset.w+'%');
  const w=$('#win'); if(w && S.winShown) w.classList.add('go');
}
function animateFinal(){
  $('#ovl').innerHTML=''; S.winShown=false;
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(reduce){ finishFinal(); return winner(); }
  const max=Math.max(1,...[...document.querySelectorAll('#fin .cnt')].map(c=>Number(c.dataset.to)||0));
  const D=Math.min(4000,Math.max(2200,max*55)); // one shared speed: every bar grows at the same rate
  requestAnimationFrame(()=>{
    const t0=performance.now();
    const tick=now=>{ const p=Math.min(1,(now-t0)/D), v=p*max;
      document.querySelectorAll('#fin .fr').forEach(r=>{ const c=r.querySelector('.cnt'), b=r.querySelector('.fb i'), to=Number(c.dataset.to)||0;
        c.textContent=Math.min(to,Math.floor(v)); b.style.width=(Math.min(to,v)/max*100)+'%'; });
      if(p<1) requestAnimationFrame(tick); else { finishFinal(); setTimeout(winner,350); } };
    requestAnimationFrame(tick);
  });
}
function closeWin(){
  const o=$('#ovl .wpop'); S.winShown=true;
  const w=$('#win'); if(w) w.classList.add('go');
  if(!o) return; o.classList.add('out'); setTimeout(()=>{ if($('#ovl .wpop')===o) $('#ovl').innerHTML=''; },250);
}
/* ---------- scorecard picture ---------- */
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function fit(c,t,w){ t=String(t); if(c.measureText(t).width<=w) return t; while(t.length>1 && c.measureText(t+'…').width>w) t=t.slice(0,-1); return t+'…'; }
async function makePng(g){
  try{ await Promise.all([document.fonts.load('800 40px Outfit'),document.fonts.load('700 30px Outfit'),document.fonts.load('500 20px Outfit')]); }catch(e){}
  const rows=standings(g), n=rows.length, W=1080, P=64, rowH=72, chunks=Math.max(1,Math.ceil(holesPlayed(g)/9)), cr=48, HP=holesPlayed(g);
  const st=320, sH=n*rowH+40, gt=st+sH+36, gH=chunks*(64+n*cr)+30, H=gt+gH+70;
  const cv=document.createElement('canvas'); cv.width=W; cv.height=H; const c=cv.getContext('2d');
  const F=(w,s)=>`${w} ${s}px Outfit, system-ui, sans-serif`;
  const gr=c.createLinearGradient(0,0,W*.4,H); gr.addColorStop(0,'#ff9447'); gr.addColorStop(.55,'#ff7a2e'); c.fillStyle=gr; c.fillRect(0,0,W,H);
  c.fillStyle='#fff'; c.font=F(700,34); c.fillText('Mini Golf',P,96);
  c.font=F(500,26); c.globalAlpha=.85; c.textAlign='right';
  c.fillText(new Date(g.started||g.created||Date.now()).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'}),W-P,96);
  c.globalAlpha=1; c.textAlign='left';
  const best=rows[0]?rows[0].tot:0, wins=rows.filter(r=>r.tot===best);
  const wt=wins.length>1?wins.map(w=>w.name).join(' & ')+' tie!':(wins[0]?wins[0].name+' wins!':'');
  let fs=76; c.font=F(800,fs); while(fs>44 && c.measureText(wt).width>W-2*P){ fs-=4; c.font=F(800,fs); }
  c.fillText(fit(c,wt,W-2*P),P,200);
  c.font=F(500,30); c.fillText(`${best} strokes · ${HP} hole${HP===1?'':'s'}`,P,250);
  c.fillStyle='#fff'; rr(c,P-24,st,W-2*P+48,sH,32); c.fill();
  rows.forEach((r,i)=>{ const y0=st+20+i*rowH, y=y0+rowH/2+12;
    if(i){ c.fillStyle='#f2e8e1'; c.fillRect(P,y0,W-2*P,2); }
    c.fillStyle='#f0590f'; c.font=F(800,34); c.fillText(String(r.rank),P+8,y);
    c.fillStyle='#1d2333'; c.font=F(700,34); c.fillText(fit(c,r.name,W-2*P-240),P+70,y);
    c.fillStyle=r.tot===best?'#f0590f':'#1a87cc'; c.font=F(800,42); c.textAlign='right'; c.fillText(String(r.tot),W-P-8,y); c.textAlign='left'; });
  c.fillStyle='#fff'; rr(c,P-24,gt,W-2*P+48,gH,32); c.fill();
  const nameW=230, cx=P+nameW, cw=(W-2*P-nameW-90)/9, tx=W-P-4;
  for(let k=0;k<chunks;k++){
    const y0=gt+24+k*(64+n*cr), hs=[]; for(let h=k*9+1;h<=Math.min(HP,k*9+9);h++) hs.push(h);
    c.font=F(500,24); c.fillStyle='#7d8496'; c.textAlign='center';
    hs.forEach((h,j)=>c.fillText(String(h),cx+cw*j+cw/2,y0+30));
    if(k===chunks-1){ c.textAlign='right'; c.fillText('Total',tx,y0+30); }
    rows.forEach((r,i)=>{ const y=y0+64+i*cr+26;
      c.textAlign='left'; c.fillStyle='#1d2333'; c.font=F(700,26); c.fillText(fit(c,r.name,nameW-24),P,y);
      c.textAlign='center'; c.font=F(500,26);
      hs.forEach((h,j)=>{ const v=r.sc[h], ok=typeof v==='number'; c.fillStyle=ok?'#1a87cc':'#c9ccd4'; c.fillText(ok?String(v):'·',cx+cw*j+cw/2,y); });
      if(k===chunks-1){ c.textAlign='right'; c.font=F(800,28); c.fillStyle=r.tot===best?'#f0590f':'#1a87cc'; c.fillText(String(r.tot),tx,y); } });
  }
  c.textAlign='left';
  return new Promise(res=>cv.toBlob(b=>res({blob:b,url:cv.toDataURL('image/png')}),'image/png'));
}
async function savePic(){
  const g=S.game; if(!g) return;
  if(!S.png || S.png.gid!==S.gid){ S.png={...(await makePng(g)),gid:S.gid}; }
  try{
    const file=new File([S.png.blob],'mini-golf-scores.png',{type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Mini golf scores'}); return; }
  }catch(e){ if(e && e.name==='AbortError') return; }
  S.sheet='pic'; render();
}
function winner(){
  if(S.game && (!S.png || S.png.gid!==S.gid)) makePng(S.game).then(p=>{ S.png={...p,gid:S.gid}; }).catch(()=>{});
  if(!S.game || S.game.status!=='done' || !S.winHtml) return;
  $('#ovl').innerHTML=`<div class="wpop" data-a="wclose" role="dialog" aria-label="Winner"><div class="win go">${S.winHtml}</div><p class="tap">Tap to continue</p></div>`;
  const c=document.createElement('div'); c.className='conf';
  const cols=['#fff','#1a87cc','#ffd2b3','#f0590f','#9fd2f2'];
  c.innerHTML=Array.from({length:60},(_,i)=>`<i style="background:${cols[i%5]};--x:${(Math.random()*120-60).toFixed(0)}vw;--r:${(Math.random()*900-450).toFixed(0)}deg;--d:${(Math.random()*.5).toFixed(2)}s;--t:${(2.2+Math.random()*1.6).toFixed(2)}s"></i>`).join('');
  document.body.appendChild(c); setTimeout(()=>c.remove(),4800);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  const a=el.dataset.a, g=S.game;
  if(a==='wclose'){ closeWin(); return; }
  if(a==='ovclose'){ if(e.target.closest('.card')&&el.classList.contains('ov')) return; $('#ovl').innerHTML=''; return; }
  if(a==='hm'){ S.holes=Math.max(1,S.holes-1); }
  else if(a==='hp'){ S.holes=Math.min(36,S.holes+1); }
  else if(a==='hs'){ S.holes=Number(el.dataset.n); }
  else if(a==='maxt'){ S.maxOn=!S.maxOn; }
  else if(a==='maxu'){ S.maxS=Math.min(20,S.maxS+1); }
  else if(a==='maxd'){ S.maxS=Math.max(1,S.maxS-1); }
  else if(a==='create') return create();
  else if(a==='start') return start();
  else if(a==='join') return join();
  else if(a==='board'){ S.sheet='board'; }
  else if(a==='close'){ S.sheet=null; }
  else if(a==='up'){ S.picked=true; S.draft=Math.min(capOf(g),S.draft+1); ls.set('mg_draft',S.gid+'|'+S.draftKey+'|'+S.draft); }
  else if(a==='down'){ S.picked=true; S.draft=Math.max(1,S.draft-1); ls.set('mg_draft',S.gid+'|'+S.draftKey+'|'+S.draft); }
  else if(a==='createask'){ S.page='create'; }
  else if(a==='joinask'){ S.page='join'; S.code=''; S.codeErr=false; render(); const i=$('#joinCode'); if(i) i.focus(); return; }
  else if(a==='back'){ S.page=''; S.code=''; S.codeErr=false; }
  else if(a==='joincode') return joinByCode();
  else if(a==='endask'){ S.sheet='end'; S.sheetAt=Date.now(); }
  else if(a==='endyes'){ if(Date.now()-S.sheetAt<450) return; return endOrLeave(); }
  else if(a==='mode'){ S.mode=S.mode==='pick'?'add':'pick'; ls.set('mg_mode2',S.mode); if(S.mode==='pick' && S.draft>(g&&g.maxStrokes&&g.maxStrokes<=10?g.maxStrokes:9)) S.picked=false; }
  else if(a==='pk'){ S.draft=Number(el.dataset.n); S.picked=true; ls.set('mg_draft',S.gid+'|'+S.draftKey+'|'+S.draft); }
  else if(a==='pkmore'){ S.mode='add'; ls.set('mg_mode2','add'); S.draft=Math.min(10,capOf(g)); S.picked=true; ls.set('mg_draft',S.gid+'|'+S.draftKey+'|'+S.draft); }
  else if(a==='check'){ if(S.mode==='pick'&&!S.picked) return; S.sheet='confirm'; S.sheetAt=Date.now(); }
  else if(a==='yes'){ if(Date.now()-S.sheetAt<450) return; return submit(); }
  else if(a==='pic') return savePic();
  else if(a==='proxy'){ S.proxy=true; S.draft=Math.min(2,capOf(g)); S.picked=false; }
  else if(a==='unproxy'){ S.proxy=false; }
  else if(a==='copycode'){
    const code=S.gid.slice(1).toUpperCase();
    try{ await navigator.clipboard.writeText(code); }
    catch(err){ const t=document.createElement('textarea'); t.value=code; t.setAttribute('readonly',''); t.style.position='fixed'; t.style.opacity='0'; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e2){} t.remove(); }
    S.copied=true; render(); clearTimeout(S.copyT); S.copyT=setTimeout(()=>{ S.copied=false; render(); },1500); return;
  }
  else if(a==='share'){
    const url=APP_URL+'#'+S.gid, code=S.gid.slice(1).toUpperCase(), text=`Join my mini golf game! Code: ${code}`;
    if(navigator.share){ try{ await navigator.share({title:'Mini Golf',text,url}); }catch(err){} return; }
    try{ await navigator.clipboard.writeText(text+' '+url); toast('Invite link copied'); }catch(err){ toast('Code: '+code); }
    return;
  }
  else if(a==='home'){ S.backTo=S.gid||''; S.page=''; ls.set('mg_gid',''); location.hash=''; if(!S.gid) render(); return; }
  else if(a==='joinfromgame'){ S.backTo=S.gid||''; S.page='join'; S.code=''; S.codeErr=false; ls.set('mg_gid',''); location.hash=''; return; }
  else if(a==='goback'){ const g=S.backTo; S.backTo=''; S.page=''; if(g){ location.hash=g; return; } }
  render();
});
document.addEventListener('input',e=>{
  if(e.target.id==='hostName'){ S.hostName=e.target.value; const b=$('#startBtn'); if(b) b.disabled=!S.hostName.trim(); saveHostName(); }
  if(e.target.id==='joinCode'){ if(S.codeErr){ S.codeErr=false; const p=e.target.nextElementSibling; if(p&&p.tagName==='P') p.remove(); } const v=e.target.value.toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,6); S.code=v; if(e.target.value!==v.toUpperCase()) e.target.value=v.toUpperCase(); const b=$('#codeBtn'); if(b) b.disabled=v.length!==6; }
  if(e.target.id==='joinName'){ S.joinName=e.target.value; const b=$('#joinBtn'); if(b) b.disabled=!S.joinName.trim(); }
});
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('dblclick',e=>e.preventDefault(),{passive:false});
document.addEventListener('touchmove',e=>{
  if(e.touches.length>1){ e.preventDefault(); return; }
  const s=e.target.closest('.fill,.sheet,.scroll');
  if(!s || (s.scrollHeight<=s.clientHeight+1 && s.scrollWidth<=s.clientWidth+1)) e.preventDefault();
},{passive:false});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter' && e.target.id==='joinName' && S.joinName.trim()) join();
  if(e.key==='Enter' && e.target.id==='joinCode' && (S.code||'').length===6) joinByCode();
  if(e.key==='Escape' && S.sheet){ S.sheet=null; render(); }
});
if(!/^#g[a-z0-9]{4,12}$/.test(location.hash||'')){ const sv=ls.get('mg_gid'); if(/^g[a-z0-9]{4,12}$/.test(sv)) history.replaceState(null,'',location.pathname+location.search+'#'+sv); }
route();
}
</script>
